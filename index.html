<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리아이 도서관 나들이 & 대여 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/50 text-slate-800 min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-amber-100 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📚</span>
                <h1 class="text-xl font-bold text-emerald-800">우리아이 도서관 대여 매니저</h1>
            </div>
            <!-- 탭 네비게이션 -->
            <nav class="flex bg-slate-100 p-1 rounded-xl text-sm font-medium">
                <button onclick="switchTab('books')" id="tab-books" class="px-4 py-2 rounded-lg transition bg-white text-emerald-700 shadow-sm">추천 도서 목록</button>
                <button onclick="switchTab('rental')" id="tab-rental" class="px-4 py-2 rounded-lg transition text-slate-600">나의 대여 목록 (<span id="rental-count">0</span>)</button>
                <button onclick="switchTab('settings')" id="tab-settings" class="px-4 py-2 rounded-lg transition text-slate-600">내 도서관 설정</button>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">

        <!-- 1. 추천 도서 목록 탭 -->
        <section id="section-books" class="space-y-6">
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex items-start gap-3">
                <span class="text-2xl">💡</span>
                <div class="text-sm text-emerald-900">
                    <p class="font-semibold mb-1">우리 아이를 위한 사서 추천 도서</p>
                    <p class="text-emerald-700">연령별 도서를 둘러보고 마음에 드는 책을 <strong>[대여 목록에 담기]</strong> 해보세요. 등록하신 도서관의 대출 가능 상태를 바로 확인할 수 있습니다.</p>
                </div>
            </div>

            <!-- 필터 바 -->
            <div class="flex flex-col sm:flex-row gap-3 justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex flex-wrap gap-2 w-full sm:w-auto" id="age-filters">
                    <button onclick="filterAge('all', this)" class="age-btn px-3.5 py-1.5 rounded-full text-sm font-medium bg-emerald-600 text-white transition">전체 연령</button>
                    <button onclick="filterAge('유아', this)" class="age-btn px-3.5 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">유아</button>
                    <button onclick="filterAge('초등 저학년', this)" class="age-btn px-3.5 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">초등 저학년</button>
                    <button onclick="filterAge('초등 고학년', this)" class="age-btn px-3.5 py-1.5 rounded-full text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition">초등 고학년</button>
                </div>
                <div class="w-full sm:w-64">
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="도서명 또는 저자 검색..." class="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- 도서 카드 그리드 -->
            <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

        <!-- 2. 나의 대여 목록 탭 -->
        <section id="section-rental" class="space-y-6 hidden">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">방문 전 도서관 소장 및 대여 현황</h2>
                    <p class="text-xs text-slate-500 mt-0.5" id="active-libs-summary">내 도서관: 불러오는 중...</p>
                </div>
                <button onclick="checkLibraryStatusAll()" class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl transition shadow-sm">
                    🔄 대여 현황 새로고침
                </button>
            </div>

            <!-- 담긴 도서 목록 -->
            <div id="rental-list" class="space-y-4"></div>
        </section>

        <!-- 3. 내 도서관 설정 탭 -->
        <section id="section-settings" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6 max-w-xl mx-auto">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">🏛️ 내 도서관 설정 (최대 3곳)</h2>
                    <p class="text-xs text-slate-500 mt-1">공공도서관과 작은도서관 모두 이름으로 검색해 등록할 수 있습니다.</p>
                </div>

                <!-- 현재 등록된 내 도서관 목록 -->
                <div class="space-y-2.5">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-emerald-700">등록된 내 도서관 (<span id="selected-lib-count">0</span>/3)</span>
                    </div>
                    <div id="my-libraries-list" class="space-y-2"></div>
                </div>

                <!-- 도서관 검색 박스 -->
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                    <div class="flex gap-2">
                        <select id="region-select" onchange="searchLibraries()" class="px-3 py-2.5 text-sm font-medium rounded-xl border border-amber-400/80 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">전국</option>
                            <option value
